<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0b0e"/>
      <stop offset="100%" stop-color="#0a0507"/>
    </linearGradient>
    <linearGradient id="aiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A35"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
    <linearGradient id="aiFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="aiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF2A35" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="url(#aiBg)" stroke="#E50914" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Robot / AI Operator Head -->
  <!-- Antenna -->
  <line x1="60" y1="20" x2="60" y2="30" stroke="#FF2A35" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="18" r="4" fill="#FF2A35" filter="url(#aiGlow)"/>

  <!-- Headset band -->
  <path d="M28 58 C 28 36, 92 36, 92 58" fill="none" stroke="url(#aiRed)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Headset Earcups -->
  <rect x="22" y="52" width="10" height="20" rx="4" fill="#E50914" filter="url(#aiGlow)"/>
  <rect x="88" y="52" width="10" height="20" rx="4" fill="#E50914" filter="url(#aiGlow)"/>

  <!-- Head Shape -->
  <rect x="34" y="34" width="52" height="46" rx="14" fill="url(#aiFace)" stroke="#444" stroke-width="1.8"/>

  <!-- Screen Visor / Eyes -->
  <rect x="40" y="44" width="40" height="18" rx="8" fill="#080808" stroke="#333" stroke-width="1"/>
  <ellipse cx="50" cy="53" rx="4" ry="4.5" fill="#00E676" filter="url(#aiGlow)"/>
  <ellipse cx="70" cy="53" rx="4" ry="4.5" fill="#00E676" filter="url(#aiGlow)"/>

  <!-- Smile / Voice wave -->
  <path d="M48 68 Q 60 74 72 68" fill="none" stroke="#E50914" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mic Boom -->
  <path d="M30 68 L 44 76" fill="none" stroke="#E50914" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="45" cy="76.5" r="3" fill="#00E676"/>

  <!-- Body / Collar -->
  <path d="M30 110 C 34 88, 86 88, 90 110 Z" fill="#18181c" stroke="#333" stroke-width="1.5"/>
  <path d="M52 89 L60 98 L68 89 Z" fill="#E50914"/>
</svg>